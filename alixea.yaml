alixeaVersion: v1.0
type: component
name: TanStack Start
description: TanStack Start component for Alixea

supportsAdditionalHosts: { serviceName: 'app' }

hosts:
  - name: App
    identifier: app
    port: 5173

images:
  - identifier: app
    prebuildImage: public.ecr.aws/p8t2q7f4/alixea/component-tanstack-start:[tag]

# Staging and production build the deployment's commit on its own machine, in the image above, with the deployment's
# environment. Development runs the dev server on the working copy instead
build:
  command: alixea-pm install && NODE_ENV=production alixea-pm run build
